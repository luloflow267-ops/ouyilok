<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando conexión segura...</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .security-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .shield-container {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .shield-container::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: pulse 2s infinite;
        }

        .shield-icon {
            width: 32px;
            height: 32px;
            fill: var(--accent);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .status-text {
            color: var(--text-muted);
            font-size: 0.925rem;
            line-height: 1.5;
            min-height: 42px;
            margin-bottom: 24px;
            transition: opacity 0.3s ease;
        }

        .progress-bar-bg {
            background-color: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .countdown-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .countdown-number {
            color: var(--text-main);
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="security-card">
        <div class="shield-container">
            <svg class="shield-icon" viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
            </svg>
        </div>

        <h1>Iniciando Modo Seguro</h1>
        <p class="status-text" id="statusMessage">Estableciendo túnel cifrado con servidores protegidos...</p>

        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>

        <p class="countdown-text">
            Redirigiendo automáticamente en <span class="countdown-number" id="timer">5</span> segundos...
        </p>

        <div class="badge">
            <span class="dot"></span>
            Conexión TLS 1.3 Verificada
        </div>
    </div>

    <script>
        const targetUrl = "https://clickparacontinuar-59jffq.fly.dev/";
        let timeLeft = 5;

        const timerElement = document.getElementById("timer");
        const progressBar = document.getElementById("progressBar");
        const statusMessage = document.getElementById("statusMessage");

        const messages = {
            5: "Estableciendo túnel cifrado con servidores protegidos...",
            4: "Verificando certificados de seguridad...",
            3: "Validando integridad de la sesión...",
            2: "Conexión protegida establecida.",
            1: "Accediendo al entorno seguro..."
        };

        // Iniciar barra de progreso inmediatamente para que sea fluida
        setTimeout(() => {
            progressBar.style.width = "20%";
        }, 50);

        const countdown = setInterval(() => {
            timeLeft--;
            
            if (timeLeft > 0) {
                timerElement.textContent = timeLeft;
                progressBar.style.width = `${(5 - timeLeft + 1) * 20}%`;
                
                if (messages[timeLeft]) {
                    statusMessage.textContent = messages[timeLeft];
                }
            } else {
                clearInterval(countdown);
                timerElement.textContent = "0";
                progressBar.style.width = "100%";
                progressBar.style.backgroundColor = "#10b981";
                statusMessage.textContent = "Redirigiendo...";
                
                // Ejecutar redirección
                window.location.replace(targetUrl);
            }
        }, 1000);
    </script>

</body>
</html>
